[package]
name = "bochat_sdk"
version = "0.1.0"
edition = "2024"
description = "BoChat 异步 Bot 开发 SDK"
license = "MIT"

[features]
default = ["http"]
http = []
ws = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = [
    "json",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "fs"] }
tracing = "0.1"
url = "2"

futures-util = { version = "0.3", optional = true }
tokio-tungstenite = { version = "0.29", optional = true, features = [
    "rustls-tls-webpki-roots",
] }


[[example]]
name = "basic_flow"
path = "examples/basic_flow.rs"
required-features = ["http"]

[[example]]
name = "ws_session"
path = "examples/ws_session.rs"
required-features = ["ws"]
