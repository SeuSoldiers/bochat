<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群聊平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 登录/注册页面 -->
        <div id="authPage" class="page active">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>

                <!-- 登录表单 -->
                <div id="loginTab" class="tab-content active">
                    <h2>用户登录</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginPhone">手机号</label>
                            <input type="text" id="loginPhone" placeholder="请输入手机号" required>
                        </div>
                        <div class="form-group">
                            <label for="loginIdNumber">身份证号</label>
                            <input type="text" id="loginIdNumber" placeholder="请输入18位身份证号" required>
                        </div>
                        <button type="submit" class="btn btn-primary">登录</button>
                        <div id="loginError" class="error-message"></div>
                    </form>
                </div>

                <!-- 注册表单 -->
                <div id="registerTab" class="tab-content">
                    <h2>用户注册</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="registerName">姓名</label>
                            <input type="text" id="registerName" placeholder="请输入真实姓名" required>
                        </div>
                        <div class="form-group">
                            <label for="registerIdNumber">身份证号</label>
                            <input type="text" id="registerIdNumber" placeholder="请输入18位身份证号" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPhone">手机号</label>
                            <input type="text" id="registerPhone" placeholder="请输入手机号" required>
                        </div>
                        <button type="submit" class="btn btn-primary">注册</button>
                        <div id="registerError" class="error-message"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 主聊天页面 -->
        <div id="chatPage" class="page">
            <div class="chat-container">
                <!-- 侧边栏 -->
                <div class="sidebar">
                    <div class="user-info">
                        <div class="user-name" id="userName"></div>
                        <button id="logoutBtn" class="btn btn-small">退出登录</button>
                    </div>

                    <div class="groups-section">
                        <div class="section-header">
                            <h3>群聊</h3>
                            <button id="createGroupBtn" class="btn-icon" title="创建群聊">+</button>
                        </div>
                        <div id="groupsList" class="groups-list"></div>
                    </div>
                </div>

                <!-- 主聊天区域 -->
                <div class="main-chat">
                    <!-- 创建群聊模态框 -->
                    <div id="createGroupModal" class="modal">
                        <div class="modal-content">
                            <span class="close">&times;</span>
                            <h2>创建新群聊</h2>
                            <form id="createGroupForm">
                                <div class="form-group">
                                    <label for="groupName">群名称</label>
                                    <input type="text" id="groupName" placeholder="输入群名称" required>
                                </div>
                                <div class="form-group">
                                    <label for="groupDescription">群描述</label>
                                    <textarea id="groupDescription" placeholder="输入群描述（可选）"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">创建</button>
                                <div id="createGroupError" class="error-message"></div>
                            </form>
                        </div>
                    </div>

                    <!-- 加入群聊模态框 -->
                    <div id="joinGroupModal" class="modal">
                        <div class="modal-content">
                            <span class="close">&times;</span>
                            <h2>加入群聊</h2>
                            <div id="availableGroups" class="available-groups"></div>
                            <div id="joinGroupError" class="error-message"></div>
                        </div>
                    </div>

                    <!-- 群聊头部 -->
                    <div id="chatHeader" class="chat-header">
                        <div class="group-title">
                            <h2 id="currentGroupName"></h2>
                            <p id="currentGroupDesc" class="group-desc"></p>
                        </div>
                        <div class="chat-header-btns">
                            <button id="joinGroupModalBtn" class="btn btn-small">加入群聊</button>
                            <button id="viewMembersBtn" class="btn btn-small">成员</button>
                        </div>
                    </div>

                    <!-- 成员列表模态框 -->
                    <div id="membersModal" class="modal">
                        <div class="modal-content">
                            <span class="close">&times;</span>
                            <h2>群成员</h2>
                            <div id="membersList" class="members-list"></div>
                        </div>
                    </div>

                    <!-- 消息区域 -->
                    <div id="messagesArea" class="messages-area">
                        <div class="messages-placeholder">选择一个群聊开始聊天</div>
                    </div>

                    <!-- 消息输入区域 -->
                    <div id="inputArea" class="input-area">
                        <form id="sendMessageForm">
                            <input
                                type="text"
                                id="messageInput"
                                placeholder="输入消息..."
                                autocomplete="off"
                            >
                            <button type="submit" class="btn btn-primary">发送</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
