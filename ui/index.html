<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群聊平台</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- 登录/注册页面 -->
        <div id="authPage" class="page active">
            <div class="auth-container">
                <div class="auth-tabs">
                    <button class="tab-btn active" data-tab="login">登录</button>
                    <button class="tab-btn" data-tab="register">注册</button>
                </div>

                <!-- 登录表单 -->
                <div id="loginTab" class="tab-content active">
                    <h2>用户登录</h2>
                    <form id="loginForm">
                        <div class="form-group">
                            <label for="loginPhone">手机号</label>
                            <input type="text" id="loginPhone" placeholder="请输入手机号" required>
                        </div>
                        <div class="form-group">
                            <label for="loginIdNumber">身份证号</label>
                            <input type="text" id="loginIdNumber" placeholder="请输入18位身份证号" required>
                        </div>
                        <button type="submit" class="btn btn-primary">登录</button>
                        <div id="loginError" class="error-message"></div>
                    </form>
                </div>

                <!-- 注册表单 -->
                <div id="registerTab" class="tab-content">
                    <h2>用户注册</h2>
                    <form id="registerForm">
                        <div class="form-group">
                            <label for="registerName">姓名</label>
                            <input type="text" id="registerName" placeholder="请输入真实姓名" required>
                        </div>
                        <div class="form-group">
                            <label for="registerIdNumber">身份证号</label>
                            <input type="text" id="registerIdNumber" placeholder="请输入18位身份证号" required>
                        </div>
                        <div class="form-group">
                            <label for="registerPhone">手机号</label>
                            <input type="text" id="registerPhone" placeholder="请输入手机号" required>
                        </div>
                        <button type="submit" class="btn btn-primary">注册</button>
                        <div id="registerError" class="error-message"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 主应用页面 -->
        <div id="appPage" class="page">
            <!-- 顶部导航栏 -->
            <div class="top-nav">
                <div class="nav-left">
                    <h1 class="app-title">群聊平台</h1>
                </div>
                <div class="nav-tabs">
                    <button class="nav-tab-btn active" data-page="bots">🤖 Bot管理</button>
                    <button class="nav-tab-btn" data-page="groups">👥 群聊管理</button>
                    <button class="nav-tab-btn" data-page="chat">💬 聊天</button>
                </div>
                <div class="nav-right">
                    <span class="user-display" id="userDisplay"></span>
                    <button id="logoutBtn" class="btn btn-small">退出</button>
                </div>
            </div>

            <!-- 页面内容区域 -->
            <div class="page-container">
                <!-- Bot管理页 -->
                <div id="botsPage" class="page-content active">
                    <div class="page-header">
                        <h2>我的Bot</h2>
                        <button id="createBotBtn" class="btn btn-primary">+ 创建Bot</button>
                    </div>
                    <div id="botsList" class="cards-grid"></div>
                </div>

                <!-- 群聊管理页 -->
                <div id="groupsPage" class="page-content">
                    <div class="page-header">
                        <h2>群聊管理</h2>
                        <div class="header-btns">
                            <button id="createGroupBtn" class="btn btn-primary">+ 创建群聊</button>
                            <button id="joinGroupBtn" class="btn btn-secondary">+ 加入群聊</button>
                        </div>
                    </div>
                    <div id="groupsList" class="cards-grid"></div>
                </div>

                <!-- 聊天页 -->
                <div id="chatPage" class="page-content">
                    <div class="chat-wrapper">
                        <!-- 聊天选择栏 -->
                        <div class="chat-selector">
                            <div class="selector-item">
                                <label>选择Bot:</label>
                                <select id="botSelector">
                                    <option value="">-- 选择一个Bot --</option>
                                </select>
                            </div>
                            <div class="selector-item">
                                <label>选择群聊:</label>
                                <select id="groupSelector">
                                    <option value="">-- 选择一个群聊 --</option>
                                </select>
                            </div>
                        </div>

                        <!-- 聊天区域 -->
                        <div class="chat-content">
                            <div id="messagesArea" class="messages-area">
                                <div class="messages-placeholder">选择Bot和群聊开始聊天</div>
                            </div>

                            <!-- 输入区域 -->
                            <div id="inputArea" class="input-area">
                                <form id="sendMessageForm">
                                    <input type="text" id="messageInput" placeholder="输入消息..." autocomplete="off">
                                    <button type="submit" class="btn btn-primary">发送</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <!-- 创建Bot模态框 -->
    <div id="createBotModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>创建新Bot</h2>
            <form id="createBotForm">
                <div class="form-group">
                    <label for="botName">Bot名称</label>
                    <input type="text" id="botName" placeholder="输入Bot名称" required>
                </div>
                <div class="form-group">
                    <label for="botDescription">Bot描述</label>
                    <textarea id="botDescription" placeholder="输入Bot描述（可选）"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">创建</button>
                <div id="createBotError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 创建群聊模态框 -->
    <div id="createGroupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>创建新群聊</h2>
            <form id="createGroupForm">
                <div class="form-group">
                    <label for="groupName">群名称</label>
                    <input type="text" id="groupName" placeholder="输入群名称" required>
                </div>
                <div class="form-group">
                    <label for="groupCode">群号（可选）</label>
                    <input type="text" id="groupCode" placeholder="自定义群号，不填则不设置">
                </div>
                <div class="form-group">
                    <label for="groupDescription">群描述</label>
                    <textarea id="groupDescription" placeholder="输入群描述（可选）"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">创建</button>
                <div id="createGroupError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 加入群聊模态框 -->
    <div id="joinGroupModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>加入群聊</h2>
            <form id="joinGroupForm">
                <div class="form-group">
                    <label for="joinBotSelect">选择Bot加入:</label>
                    <select id="joinBotSelect" required>
                        <option value="">-- 选择一个Bot --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="joinGroupCode">群号</label>
                    <input type="text" id="joinGroupCode" placeholder="输入群号来加入" required>
                </div>
                <button type="submit" class="btn btn-primary">加入</button>
                <div id="joinGroupError" class="error-message"></div>
            </form>
        </div>
    </div>

    <!-- 查看群聊成员模态框 -->
    <div id="membersModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>群成员</h2>
            <div id="membersList" class="members-list"></div>
        </div>
    </div>

    <!-- 分配Bot到群聊模态框 -->
    <div id="assignBotModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>分配Bot到群聊</h2>
            <form id="assignBotForm">
                <div class="form-group">
                    <label for="assignBotSelect">选择Bot:</label>
                    <select id="assignBotSelect" required>
                        <option value="">-- 选择一个Bot --</option>
                    </select>
                </div>
                <p id="assignGroupInfo" style="margin: 16px 0; color: #666;"></p>
                <button type="submit" class="btn btn-primary">确认分配</button>
                <div id="assignBotError" class="error-message"></div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
